<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Órdenes de Compra</mat-card-title>
      <button mat-raised-button color="primary" routerLink="/ordenes-compra/nuevo">
        <mat-icon>add</mat-icon> Crear
      </button>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente }}</td>
          </ng-container>
          <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef>Contrato</th>
            <td mat-cell *matCellDef="let row">{{ row.contrato }}</td>
          </ng-container>
          <ng-container matColumnDef="partida">
            <th mat-header-cell *matHeaderCellDef>Partida</th>
            <td mat-cell *matCellDef="let row">{{ row.partida }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaInicioSemana">
            <th mat-header-cell *matHeaderCellDef>Fecha Inicio Semana</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaInicioSemana | date }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/ordenes-compra', row.id]" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmarEliminar(row.id)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalElements"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange()"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
