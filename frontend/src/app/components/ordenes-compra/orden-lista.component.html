<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Órdenes de Compra</mat-card-title>
      <div class="header-actions">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Periodo</mat-label>
          <input matInput [matDatepicker]="picker" [(ngModel)]="fechaSeleccionada" (dateChange)="onFechaChange()" placeholder="Seleccionar fecha">
          <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
          <mat-datepicker #picker></mat-datepicker>
          @if (fechaSeleccionada) {
            <button matSuffix mat-icon-button (click)="limpiarBusqueda()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Buscar orden</mat-label>
          <input matInput [(ngModel)]="searchQuery" (keyup.enter)="filtrar()" placeholder="Contrato, cliente o partida">
          @if (searchQuery) {
            <button matSuffix mat-icon-button (click)="searchQuery = ''; filtrar()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
        <button mat-raised-button color="primary" routerLink="/ordenes-compra/nuevo">
          <mat-icon>add</mat-icon> Crear
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Contrato</th>
            <td mat-cell *matCellDef="let row">{{ row.contrato }}</td>
          </ng-container>
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente }}</td>
          </ng-container>
          <ng-container matColumnDef="partida">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Partida</th>
            <td mat-cell *matCellDef="let row">{{ row.partida }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaInicioSemana">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Inicio Semana</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaInicioSemana | date }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/ordenes-compra', row.id]" (click)="$event.stopPropagation()" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="$event.stopPropagation(); confirmarEliminar(row.id)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            class="data-row"
            (click)="verOrden(row.id)"></tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalElements"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange()"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
