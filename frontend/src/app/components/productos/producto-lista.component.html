<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Productos</mat-card-title>
      <div class="header-actions">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Buscar</mat-label>
          <input matInput [(ngModel)]="searchQuery" (keyup.enter)="buscar()" placeholder="Buscar producto...">
          @if (searchQuery) {
            <button matSuffix mat-icon-button (click)="limpiarBusqueda()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
        <button mat-raised-button color="primary" routerLink="/productos/nuevo">
          <mat-icon>add</mat-icon> Crear
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
            <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
          </ng-container>
          <ng-container matColumnDef="partida">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Partida</th>
            <td mat-cell *matCellDef="let row">{{ row.partida }}</td>
          </ng-container>
          <ng-container matColumnDef="categoria">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Categoría</th>
            <td mat-cell *matCellDef="let row">{{ row.categoria }}</td>
          </ng-container>
          <ng-container matColumnDef="precioVenta">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Precio Venta</th>
            <td mat-cell *matCellDef="let row">{{ row.precioVenta | currency }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/productos', row.id]" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmarEliminar(row.id, row.nombre)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalElements"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        (page)="onPageChange()"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
