<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Contratos</mat-card-title>
      <div class="header-actions">
        <mat-form-field appearance="outline" subscriptSizing="dynamic">
          <mat-label>Buscar contrato</mat-label>
          <input matInput [(ngModel)]="searchQuery" (keyup.enter)="buscar()" placeholder="Contrato o cliente">
          @if (searchQuery) {
            <button matSuffix mat-icon-button (click)="limpiarBusqueda()">
              <mat-icon>close</mat-icon>
            </button>
          }
        </mat-form-field>
        <button mat-raised-button color="primary" routerLink="/contratos/nuevo">
          <mat-icon>add</mat-icon> Registrar
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="dataSource" matSort>
          <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Contrato</th>
            <td mat-cell *matCellDef="let row">{{ row.contrato }}</td>
          </ng-container>
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaInicio">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Inicio</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaInicio | date }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaTermino">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Fecha Término</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaTermino | date }}</td>
          </ng-container>
          <ng-container matColumnDef="presupuesto">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Presupuesto</th>
            <td mat-cell *matCellDef="let row">{{ row.presupuesto | currency }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/contratos', row.id]" (click)="$event.stopPropagation()" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="$event.stopPropagation(); confirmarEliminar(row.id, row.contrato)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"
            class="data-row"
            (click)="verContrato(row.id)"></tr>
        </table>
      </div>
      <mat-paginator
        [length]="totalElements"
        [pageSize]="10"
        [pageSizeOptions]="[5, 10, 25, 50]"
        showFirstLastButtons>
      </mat-paginator>
    </mat-card-content>
  </mat-card>
</div>
