<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Contratos</mat-card-title>
      <button mat-raised-button color="primary" routerLink="/contratos/nuevo">
        <mat-icon>add</mat-icon> Crear
      </button>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="contratos">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>
          <ng-container matColumnDef="contrato">
            <th mat-header-cell *matHeaderCellDef>Contrato</th>
            <td mat-cell *matCellDef="let row">{{ row.contrato }}</td>
          </ng-container>
          <ng-container matColumnDef="cliente">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let row">{{ row.cliente }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaInicio">
            <th mat-header-cell *matHeaderCellDef>Fecha Inicio</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaInicio | date }}</td>
          </ng-container>
          <ng-container matColumnDef="fechaTermino">
            <th mat-header-cell *matHeaderCellDef>Fecha Término</th>
            <td mat-cell *matCellDef="let row">{{ row.fechaTermino | date }}</td>
          </ng-container>
          <ng-container matColumnDef="presupuesto">
            <th mat-header-cell *matHeaderCellDef>Presupuesto</th>
            <td mat-cell *matCellDef="let row">{{ row.presupuesto | currency }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/contratos', row.id]" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmarEliminar(row.id, row.contrato)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
