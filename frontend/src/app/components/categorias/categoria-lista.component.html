<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>Categorías</mat-card-title>
      <button mat-raised-button color="primary" routerLink="/categorias/nuevo">
        <mat-icon>add</mat-icon> Crear
      </button>
    </mat-card-header>
    <mat-card-content>
      <div class="table-wrapper">
        <table mat-table [dataSource]="categorias">
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>ID</th>
            <td mat-cell *matCellDef="let row">{{ row.id }}</td>
          </ng-container>
          <ng-container matColumnDef="nombre">
            <th mat-header-cell *matHeaderCellDef>Nombre</th>
            <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
          </ng-container>
          <ng-container matColumnDef="partida">
            <th mat-header-cell *matHeaderCellDef>Partida</th>
            <td mat-cell *matCellDef="let row">{{ row.partida }}</td>
          </ng-container>
          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let row">
              <button mat-icon-button color="primary" [routerLink]="['/categorias', row.id]" matTooltip="Editar">
                <mat-icon>edit</mat-icon>
              </button>
              <button mat-icon-button color="warn" (click)="confirmarEliminar(row.id, row.nombre)" matTooltip="Eliminar">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    </mat-card-content>
  </mat-card>
</div>
