<div class="container">
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ esEdicion ? 'Editar Categoría' : 'Nueva Categoría' }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      @if (cargando) {
        <div class="spinner-wrapper">
          <mat-spinner diameter="40"></mat-spinner>
        </div>
      } @else {
        <form [formGroup]="form" (ngSubmit)="guardar()" class="form-grid">
          <mat-form-field appearance="outline">
            <mat-label>Nombre</mat-label>
            <input matInput formControlName="nombre" placeholder="Nombre de la categoría">
            @if (form.get('nombre')?.hasError('required')) {
              <mat-error>Requerido</mat-error>
            }
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Partida</mat-label>
            <mat-select formControlName="partida">
              @for (p of partidas; track p) {
                <mat-option [value]="p">{{ p }}</mat-option>
              }
            </mat-select>
            @if (form.get('partida')?.hasError('required')) {
              <mat-error>Requerido</mat-error>
            }
          </mat-form-field>

          <div class="form-actions">
            <button mat-button type="button" (click)="cancelar()">Cancelar</button>
            <button mat-raised-button color="primary" type="submit" [disabled]="form.invalid">
              {{ esEdicion ? 'Actualizar' : 'Guardar' }}
            </button>
          </div>
        </form>
      }
    </mat-card-content>
  </mat-card>
</div>
